global:
  namespace: app-production
  awsRegion: us-east-1

# External Managed Infrastructure Parameters
externalServices:
  rds:
    host: "app-production-db.c1234567890.us-east-1.rds.amazonaws.com"
    port: 5432
    dbName: "app_db"
  s3:
    bucketName: "company-app-data-bucket-2026"
  sns:
    topicArn: "arn:aws:sns:us-east-1:123456789012:app-system-alerts"

# Database Credentials Secret Settings
databaseSecret:
  name: "db-credentials"
  create: false # Set to true only in dev when using secret-example.yaml

# AWS IAM Roles for Service Accounts (IRSA)
serviceAccounts:
  backend:
    create: true
    name: sa-app-backend
    roleArn: "arn:aws:iam::123456789012:role/eks-backend-s3-sns-role"
  worker:
    create: true
    name: sa-app-worker
    roleArn: "arn:aws:iam::123456789012:role/eks-worker-s3-role"

# Component Configurations
frontend:
  replicaCount: 2
  image:
    repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/app-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 80
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

backend:
  replicaCount: 2
  image:
    repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/app-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

worker:
  replicaCount: 1
  image:
    repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/app-worker
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: app.company.com
      paths:
        - path: /
          pathType: Prefix
          backend: frontend
        - path: /api
          pathType: Prefix
          backend: backend
  tls:
    - secretName: app-tls-cert
      hosts:
        - app.company.com